events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  # Upstream targets (pointing to host machine from inside Docker container)
  upstream backend_api {
    server host.docker.internal:4000;
  }

  upstream shell_spa {
    server host.docker.internal:3000;
  }

  upstream seo_ssr {
    server host.docker.internal:3003;
  }

  upstream catalog_mfe {
    server host.docker.internal:3001;
  }

  upstream checkout_mfe {
    server host.docker.internal:3002;
  }

  server {
    listen 8080;
    server_name localhost;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # =========================================================================
    # 🎛️ SSR TOGGLE LOGIC:
    # 1. Flag mặc định: 1 = ON (dùng seo-ssr), 0 = OFF (fallback 100% SPA)
    # 2. Hỗ trợ query ?ssr=0 hoặc cookie disable_ssr=1 để tắt SSR tức thì
    # =========================================================================
    set $ssr_active 1;

    if ($arg_ssr = "0") {
      set $ssr_active 0;
    }
    if ($http_cookie ~* "disable_ssr=1") {
      set $ssr_active 0;
    }

    # -------------------------------------------------------------------------
    # 1. BACKEND API ROUTING (/api/v1/*)
    # -------------------------------------------------------------------------
    location /api/v1/ {
      proxy_pass http://backend_api;
    }

    # -------------------------------------------------------------------------
    # 2. NEXT.JS ASSETS & ROUTING (/ _next/*)
    # -------------------------------------------------------------------------
    location /_next/ {
      proxy_pass http://seo_ssr;
    }

    # -------------------------------------------------------------------------
    # 3. STATIC SEO FILES (/sitemap.xml, /robots.txt)
    # -------------------------------------------------------------------------
    location = /sitemap.xml {
      proxy_pass http://seo_ssr/sitemap.xml;
    }

    location = /robots.txt {
      proxy_pass http://seo_ssr/robots.txt;
    }

    # -------------------------------------------------------------------------
    # 4. PRIVATE / TRANSACTIONAL PATHS -> Always forward to Shell SPA (:3000)
    # -------------------------------------------------------------------------
    location ^~ /cart {
      proxy_pass http://shell_spa;
    }

    location ^~ /checkout {
      proxy_pass http://shell_spa;
    }

    location ^~ /account {
      proxy_pass http://shell_spa;
    }

    location = /login {
      proxy_pass http://shell_spa;
    }

    location = /register {
      proxy_pass http://shell_spa;
    }

    # Module Federation Remote Entries & Vite dev assets
    location ^~ /@mf- {
      proxy_pass http://shell_spa;
    }

    location ^~ /@vite {
      proxy_pass http://shell_spa;
    }

    location ^~ /@fs {
      proxy_pass http://shell_spa;
    }

    location ^~ /src/ {
      proxy_pass http://shell_spa;
    }

    location ^~ /node_modules/ {
      proxy_pass http://shell_spa;
    }

    # -------------------------------------------------------------------------
    # 5. PUBLIC BROWSING PATHS (/products, /categories, /search, /)
    #    -> If SSR Active (1) => Next.js (:3003)
    #    -> If SSR Off (0)    => Shell SPA (:3000)
    # -------------------------------------------------------------------------
    location /products {
      if ($ssr_active = 0) {
        proxy_pass http://shell_spa;
        break;
      }
      proxy_pass http://seo_ssr;
    }

    location /categories {
      if ($ssr_active = 0) {
        proxy_pass http://shell_spa;
        break;
      }
      proxy_pass http://seo_ssr;
    }

    location /search {
      if ($ssr_active = 0) {
        proxy_pass http://shell_spa;
        break;
      }
      proxy_pass http://seo_ssr;
    }

    # Root Path (Trang chủ /)
    location / {
      if ($ssr_active = 0) {
        proxy_pass http://shell_spa;
        break;
      }
      proxy_pass http://seo_ssr;
    }
  }
}
